</main>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Trình xem media"><button id="close" class="close" type="button" aria-label="Đóng">×</button><div class="zoom"><button id="minus" type="button" aria-label="Thu nhỏ">−</button><span id="zoomText">100%</span><button id="plus" type="button" aria-label="Phóng to">＋</button><button id="reset" type="button">Đặt lại</button></div><button id="prev" class="nav prev" type="button" aria-label="Tệp trước">‹</button><div id="viewer" class="viewer"></div><button id="next" class="nav next" type="button" aria-label="Tệp tiếp theo">›</button><div id="viewerName" class="viewer-name"></div></div>

  async function upload(mode){if(uploadBusy)return;const files=Array.from(fileInput.files||[]);if(!files.length)return setStatus('Vui lòng chọn tệp trước.',true);const audioMode=mode==='audio',pattern=audioMode?/^(audio|video)\//:/^(image|video)\//;const invalid=files.find(file=>!pattern.test(file.type));if(invalid)return setStatus(audioMode?'Nút Tải âm thanh chỉ nhận file âm thanh hoặc video.':'Nút Tải ảnh/video chỉ nhận hình ảnh hoặc video.',true);const tooLarge=files.find(file=>file.size>MAX_BYTES);if(tooLarge)return setStatus(`Tệp “${tooLarge.name}” vượt quá giới hạn ${formatSize(MAX_BYTES)}.`,true);if(!user)return setStatus('Phiên đăng nhập đã hết. Vui lòng đăng nhập lại.',true);setUploadBusy(true);try{for(let i=0;i<files.length;i++){if(!uploadBusy)throw cancelledError();let output=files[i];setProgress(0);setStatus(`${audioMode?'Đang chuẩn bị âm thanh':'Đang chuẩn bị media'} (${i+1}/${files.length})…`);if(audioMode&&output.type.startsWith('video/')){output=await extractAudio(output);if(output.size>MAX_BYTES)throw new Error(`Âm thanh sau khi tách vượt quá ${formatSize(MAX_BYTES)}.`)}const dataUrl=await readAsDataUrl(output,i,files.length);if(!uploadBusy)throw cancelledError();setStatus(`Đang lưu ${i+1}/${files.length} vào thư viện…`);await db.ref(`media/${user.uid}`).push({url:dataUrl,type:output.type,name:output.name,size:output.size,mode:audioMode?'audio':'media',createdAt:firebase.database.ServerValue.TIMESTAMP})}fileInput.value='';$("fileName").textContent='Chọn ảnh, video hoặc âm thanh';setProgress(100);setStatus(audioMode?'Đã lưu âm thanh trong Nhạc.':'Đã lưu media trong thư viện.',false,true)}catch(error){if(error&&error.code==='CANCELLED')setStatus('Đã hủy tải lên.',true);else{console.error(error);setStatus(`Không thể tải lên: ${readableError(error)}`,true)}}finally{setUploadBusy(false)}}
  function cancelledError(){const error=new Error('Đã hủy');error.code='CANCELLED';return error}

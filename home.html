<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111827">
<title>MediaVault</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--primary:#7f56d9;--danger:#d92d20;--shadow:0 14px 35px #10182812}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#f8faff,#f0efff)}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;padding:24px 16px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.brand{display:flex;gap:11px;align-items:center}.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;color:#fff;font-weight:900;background:linear-gradient(135deg,#7f56d9,#f04438)}h1{font-size:21px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:8px;position:relative}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:750;transition:.2s}.primary{color:#fff;background:var(--primary)}.primary:hover{background:#6941c6}.ghost{color:var(--ink);background:#fff;border:1px solid var(--line)}.panel,.toolbar{background:var(--card);border:1px solid #e4e7ecaa;border-radius:18px;box-shadow:var(--shadow)}.hero{display:grid;grid-template-columns:1.4fr .6fr;gap:16px;margin-bottom:18px}.panel{padding:20px}.panel h2{font-size:18px;margin:0 0 5px}.panel p{font-size:13px;color:var(--muted);margin:0 0 16px}.upload-row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.picker{display:inline-flex;align-items:center;max-width:100%;padding:11px 13px;border:1.5px dashed #b9a5eb;border-radius:11px;color:#6941c6;background:#fbfaff;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.picker input{display:none}.hint,.status{width:100%;font-size:12px;color:var(--muted);margin-top:8px}.status{min-height:18px;color:#6941c6;font-weight:700}.stat-label{font-size:13px;color:var(--muted)}.stat-num{display:block;font-size:42px;font-weight:850;line-height:1.1;margin:5px 0}.toolbar{display:flex;gap:9px;padding:11px;margin-bottom:18px}.search{flex:1;min-width:130px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;outline:0}.search:focus{border-color:var(--primary);box-shadow:0 0 0 3px #ede9fe}.select{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:15px}.empty{grid-column:1/-1;text-align:center;padding:60px 18px;border:1px dashed #cfd4dc;border-radius:18px;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:5px}.card{position:relative;overflow:hidden;min-height:210px;border-radius:15px;background:#101828;box-shadow:0 8px 20px #1018281c;cursor:pointer}.card img,.card video{display:block;width:100%;height:210px;object-fit:cover}.card-info{position:absolute;right:0;bottom:0;left:0;padding:35px 11px 10px;color:#fff;font-size:12px;background:linear-gradient(transparent,#000c)}.card-info span{opacity:.7}.delete{position:absolute;right:8px;top:8px;border:0;border-radius:8px;padding:6px 9px;color:#fff;background:#101828bb;opacity:0}.card:hover .delete,.card:focus-within .delete{opacity:1}.music-menu{display:none;position:absolute;right:0;top:46px;width:290px;max-height:330px;overflow:auto;padding:8px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:20}.music-menu.open{display:block}.music-row{display:flex;align-items:center;gap:7px;padding:8px;border-radius:8px}.music-row:hover{background:#f8f9fc}.play{flex:1;border:0;background:transparent;text-align:left;color:var(--ink);font-size:13px}.remove{border:0;padding:5px 7px;border-radius:6px;color:var(--danger);background:#fee4e2;font-size:11px}.modal{display:none;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;background:#030712f2}.modal.open{display:flex}.viewer{width:100%;height:100%;display:grid;place-items:center;overflow:hidden;touch-action:none}.viewer img,.viewer video{max-width:94vw;max-height:86vh;object-fit:contain;transform-origin:center;user-select:none}.viewer audio{width:min(500px,84vw)}.close,.nav,.zoom{position:absolute;z-index:3;border:0;color:#fff;background:#ffffff22}.close{right:20px;top:18px;width:42px;height:42px;border-radius:50%;font-size:26px}.nav{top:50%;width:43px;height:43px;border-radius:50%;font-size:30px;transform:translateY(-50%)}.prev{left:20px}.next{right:20px}.zoom{top:20px;left:50%;display:flex;align-items:center;gap:4px;padding:6px;border-radius:11px;transform:translateX(-50%)}.zoom button{border:0;border-radius:7px;padding:6px 10px;color:#fff;background:#ffffff22}.zoom span{min-width:44px;text-align:center;font-size:12px}@media(max-width:700px){.app{padding:16px 11px 34px}.top{align-items:flex-start}.hero{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}.select{flex:1}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card,.card img,.card video{min-height:160px;height:160px}.delete{opacity:1}.picker{width:100%}.upload-row .btn{flex:1}.nav{width:37px;height:37px}.prev{left:8px}.next{right:8px}}
</style>
</head>
<body><main class="app">
<header class="top"><div class="brand"><div class="mark">M</div><div><h1>MediaVault</h1><div class="sub">Thư viện riêng tư của bạn</div></div></div><div class="actions"><button class="btn ghost" id="musicBtn" type="button">Nhạc</button><div id="musicMenu" class="music-menu"></div><button class="btn ghost" id="logout" type="button">Đăng xuất</button></div></header>
<section class="hero"><div class="panel"><h2>Thêm tệp mới</h2><p>Chọn một tệp, sau đó chọn cách lưu.</p><div class="upload-row"><label class="picker"><span id="fileName">Chọn ảnh, video hoặc âm thanh</span><input id="fileInput" type="file" accept="image/*,video/*,audio/*"></label><button id="uploadMedia" class="btn primary" type="button">Tải ảnh/video</button><button id="uploadAudio" class="btn ghost" type="button">Tải âm thanh</button><div class="hint">Tải âm thanh từ file âm thanh trực tiếp hoặc tách âm thanh từ video.</div><div id="status" class="status" role="status" aria-live="polite"></div></div></div><div class="panel"><span class="stat-label">Tổng media</span><strong class="stat-num" id="count">0</strong><span class="sub" id="details">0 ảnh · 0 video · 0 âm thanh</span></div></section>
<section class="toolbar"><input id="search" class="search" type="search" placeholder="Tìm tệp…"><select id="filter" class="select"><option value="all">Tất cả</option><option value="image">Hình ảnh</option><option value="video">Video</option></select><select id="sort" class="select"><option value="new">Mới nhất</option><option value="old">Cũ nhất</option></select></section><section id="gallery" class="gallery"></section></main>
<div id="modal" class="modal" role="dialog" aria-modal="true"><button id="close" class="close" aria-label="Đóng">×</button><div class="zoom"><button id="minus" type="button">−</button><span id="zoomText">100%</span><button id="plus" type="button">＋</button><button id="reset" type="button">Đặt lại</button></div><button id="prev" class="nav prev" aria-label="Trước">‹</button><div id="viewer" class="viewer"></div><button id="next" class="nav next" aria-label="Sau">›</button></div>
<script>
const config={apiKey:"AIzaSyCmLLI3wHywsLB33QmJDSgUzQcfS3GJgso",authDomain:"haha-ba0bc.firebaseapp.com",projectId:"haha-ba0bc",messagingSenderId:"748739861694",appId:"1:748739861694:web:492d2a164fec150840d2ef",databaseURL:"https://haha-ba0bc-default-rtdb.asia-southeast1.firebasedatabase.app"};if(!firebase.apps.length)firebase.initializeApp(config);const db=firebase.database();let user=null,items=[],shown=[],index=-1,audio=new Audio(),scale=1,x=0,y=0,drag=false,startX=0,startY=0;
const $=id=>document.getElementById(id),setStatus=(t,err=false)=>{$("status").textContent=t;$('status').style.color=err?'#d92d20':'#6941c6'};const kind=i=>i.type.split('/')[0];
firebase.auth().onAuthStateChanged(u=>{if(!u)return location.replace('index.html');user=u;db.ref(`media/${u.uid}`).on('value',snap=>{items=[];snap.forEach(c=>{const d=c.val();if(d&&d.url&&d.type)items.push({key:c.key,...d})});items.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));render();renderMusic()})});
$('logout').onclick=()=>firebase.auth().signOut();$('musicBtn').onclick=()=>{$('musicMenu').classList.toggle('open');renderMusic()};$('fileInput').onchange=e=>{$('fileName').textContent=e.target.files[0]?.name||'Chọn ảnh, video hoặc âm thanh'};$('uploadMedia').onclick=()=>upload('media');$('uploadAudio').onclick=()=>upload('audio');$('search').oninput=render;$('filter').onchange=render;$('sort').onchange=render;
function readFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onprogress=e=>e.lengthComputable&&setStatus(`Đang đọc tệp… ${Math.round(e.loaded/e.total*100)}%`);r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Không đọc được tệp'));r.readAsDataURL(file)})}
function extractAudio(file){return new Promise((res,rej)=>{const AC=window.AudioContext||window.webkitAudioContext;if(!window.MediaRecorder||!AC)return rej(new Error('Trình duyệt không hỗ trợ tách âm thanh'));const v=document.createElement('video'),url=URL.createObjectURL(file),ctx=new AC();v.src=url;v.preload='auto';v.playsInline=true;v.onloadedmetadata=async()=>{try{const src=ctx.createMediaElementSource(v),dst=ctx.createMediaStreamDestination();src.connect(dst);const type=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm',rec=new MediaRecorder(dst.stream,{mimeType:type}),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{URL.revokeObjectURL(url);ctx.close();res(new File([new Blob(chunks,{type})],file.name.replace(/\.[^.]+$/i,'.webm'),{type}))};v.onended=()=>rec.state!=='inactive'&&rec.stop();rec.start();await v.play();setStatus('Đang tách âm thanh theo thời lượng video…')}catch(e){URL.revokeObjectURL(url);ctx.close();rej(e)}};v.onerror=()=>rej(new Error('Không đọc được video'))})}
async function upload(mode){const input=$('fileInput'),file=input.files[0],button=mode==='audio'?$('uploadAudio'):$('uploadMedia');if(!file)return setStatus('Vui lòng chọn tệp trước.',true);if(file.size>35*1024*1024)return setStatus('Tệp vượt quá 35 MB ở chế độ lưu cũ.',true);const ok=mode==='audio'?/^(audio|video)\//:/^(image|video)\//;if(!ok.test(file.type))return setStatus(mode==='audio'?'Nút này chỉ nhận file âm thanh hoặc video.':'Nút này chỉ nhận ảnh hoặc video.',true);button.disabled=true;try{let out=file;if(mode==='audio'&&file.type.startsWith('video/'))out=await extractAudio(file);setStatus('Đang lưu tệp…');const url=await readFile(out);await db.ref(`media/${user.uid}`).push({url,type:out.type,name:out.name,size:out.size,mode,createdAt:firebase.database.ServerValue.TIMESTAMP});input.value='';$('fileName').textContent='Chọn ảnh, video hoặc âm thanh';setStatus(mode==='audio'?'Đã lưu trong Nhạc.':'Đã lưu trong thư viện.')}catch(e){console.error(e);setStatus(`Không thể lưu tệp: ${e.message||'lỗi không xác định'}`,true)}finally{button.disabled=false}}
function render(){const q=$('search').value.toLowerCase().trim(),f=$('filter').value,old=$('sort').value==='old';shown=items.filter(i=>['image','video'].includes(kind(i))&&(f==='all'||kind(i)===f)&&(!q||(i.name||'').toLowerCase().includes(q)));if(old)shown.reverse();$('count').textContent=items.length;$('details').textContent=`${items.filter(i=>kind(i)==='image').length} ảnh · ${items.filter(i=>kind(i)==='video').length} video · ${items.filter(i=>kind(i)==='audio').length} âm thanh`;const g=$('gallery');g.replaceChildren();if(!shown.length){const e=document.createElement('div');e.className='empty';e.innerHTML='<b>Chưa có ảnh hoặc video</b><span>Âm thanh được lưu riêng trong nút Nhạc.</span>';g.appendChild(e);return}shown.forEach((item,n)=>{const c=document.createElement('article');c.className='card';c.tabIndex=0;const el=document.createElement(kind(item)==='image'?'img':'video');el.src=item.url;if(kind(item)==='image'){el.alt=item.name||'Ảnh';el.loading='lazy'}else{el.muted=true;el.preload='metadata'}c.appendChild(el);const info=document.createElement('div');info.className='card-info';info.innerHTML=`<b>${escape(item.name||'Tệp')}</b><br><span>${kind(item).toUpperCase()}</span>`;c.appendChild(info);const del=document.createElement('button');del.className='delete';del.textContent='Xóa';del.onclick=e=>{e.stopPropagation();remove(item)};c.appendChild(del);const open=()=>openAt(n);c.onclick=open;c.onkeydown=e=>{if(e.key==='Enter')open()};g.appendChild(c)})}
function escape(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function renderMusic(){const menu=$('musicMenu');menu.replaceChildren();const list=items.filter(i=>kind(i)==='audio');if(!list.length){menu.textContent='Chưa có âm thanh.';return}list.forEach(i=>{const row=document.createElement('div');row.className='music-row';const p=document.createElement('button');p.className='play';p.textContent=`♫ ${i.name||'Âm thanh'}`;p.onclick=()=>{if(audio.src===i.url&&!audio.paused)audio.pause();else{audio.src=i.url;audio.play().catch(()=>setStatus('Hãy chạm lại để phát âm thanh.',true))}};const d=document.createElement('button');d.className='remove';d.textContent='Xóa';d.onclick=()=>remove(i);row.append(p,d);menu.appendChild(row)})}
async function remove(i){if(!confirm(`Xóa “${i.name||'tệp này'}”?`))return;await db.ref(`media/${user.uid}/${i.key}`).remove()}
function openAt(n){index=n;scale=1;x=0;y=0;const i=shown[n],v=$('viewer');v.replaceChildren();const el=document.createElement(kind(i)==='image'?'img':'video');el.src=i.url;el.id='view';if(kind(i)==='image')el.alt=i.name||'Ảnh';else{el.controls=true;el.autoplay=true;el.loop=true}$('modal').classList.add('open');v.appendChild(el);transform();if(kind(i)==='image')touchZoom(v)}
function transform(){const el=$('view');if(el){el.style.transform=`translate(${x}px,${y}px) scale(${scale})`;$('zoomText').textContent=`${Math.round(scale*100)}%`}}
function touchZoom(v){let pts=new Map(),dist=0,start=1,last=0;v.onpointerdown=e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});v.setPointerCapture(e.pointerId);if(pts.size===1){const now=Date.now();if(now-last<280){scale=scale>1?1:2;x=0;y=0;transform()}last=now;drag=scale>1;startX=e.clientX-x;startY=e.clientY-y}else{drag=false;const a=[...pts.values()];dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);start=scale}};v.onpointermove=e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2){const a=[...pts.values()];scale=Math.max(.5,Math.min(4,start*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/dist));transform()}else if(drag){x=e.clientX-startX;y=e.clientY-startY;transform()}};const end=e=>{pts.delete(e.pointerId);if(!pts.size)drag=false};v.onpointerup=end;v.onpointercancel=end;v.onwheel=e=>{e.preventDefault();scale=Math.max(.5,Math.min(4,scale-e.deltaY*.001));transform()}}
function close(){const v=$('viewer video');if(v)v.pause();$('modal').classList.remove('open');$('viewer').replaceChildren()}function change(d){if(!shown.length)return;index=(index+d+shown.length)%shown.length;openAt(index)}
$('close').onclick=close;$('prev').onclick=()=>change(-1);$('next').onclick=()=>change(1);$('modal').onclick=e=>e.target.id==='modal'&&close();$('plus').onclick=()=>{scale=Math.min(4,scale+.25);transform()};$('minus').onclick=()=>{scale=Math.max(.5,scale-.25);transform()};$('reset').onclick=()=>{scale=1;x=0;y=0;transform()};document.onkeydown=e=>{if(!$('modal').classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')change(-1);if(e.key==='ArrowRight')change(1)};
</script></body></html>

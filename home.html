    function cancelUpload(){if(uploadTask){setStatus('Đang hủy tải lên…');uploadTask.cancel()}}
    function render(){const query=ui.search.value.trim().toLocaleLowerCase('vi'),filter=ui.filter.value;let shown=items.filter(x=>{const k=kind(x);return ['image','video'].includes(k)&&(filter==='all'||k===filter)&&String(x.name||'').toLocaleLowerCase('vi').includes(query)});if(ui.sort.value==='name')shown.sort((a,b)=>String(a.name).localeCompare(String(b.name),'vi'));else if(ui.sort.value==='old')shown.sort((a,b)=>Number(a.createdAt||0)-Number(b.createdAt||0));else if(ui.sort.value==='custom')shown.sort((a,b)=>Number(a.position??1e9)-Number(b.position??1e9));else shown.sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));viewerItems=shown;ui.count.textContent=shown.length;ui.countLabel.textContent=query||filter!=='all'?'Kết quả đang hiển thị':'Ảnh và video';ui.details.textContent=`${items.filter(x=>kind(x)==='image').length} ảnh · ${items.filter(x=>kind(x)==='video').length} video · ${items.filter(x=>x.mode==='audio'||kind(x)==='audio').length} bài nhạc`;ui.gallery.replaceChildren();if(!shown.length){const box=document.createElement('div');box.className='empty';const title=document.createElement('strong');title.textContent=items.some(x=>['image','video'].includes(kind(x)))?'Không tìm thấy tệp phù hợp':'Thư viện chưa có ảnh hoặc video';const text=document.createElement('span');text.textContent=items.some(x=>['image','video'].includes(kind(x)))?'Thử đổi từ khóa hoặc bộ lọc.':'Chọn ảnh hoặc video ở phía trên để bắt đầu.';box.append(title,text);ui.gallery.append(box);return}shown.forEach((item,index)=>ui.gallery.append(makeTile(item,index)))}
    function makeTile(item,index){const tile=document.createElement('article');tile.className='tile';const open=document.createElement('button');open.className='preview';open.type='button';open.setAttribute('aria-label',`Mở ${item.name||'tệp'}`);const media=document.createElement(kind(item)==='image'?'img':'video');media.src=item.url;media.alt=kind(item)==='image'?(item.name||'Ảnh'):'';if(kind(item)==='image'){media.loading=index<6?'eager':'lazy';media.decoding='async'}else{media.muted=true;media.preload='metadata'}open.append(media);open.onclick=()=>openViewer(index);const info=document.createElement('div');info.className='tile-info';const nm=document.createElement('div');nm.className='tile-name';nm.textContent=item.name||'Tệp';const meta=document.createElement('div');meta.className='tile-meta';meta.textContent=`${kind(item)==='image'?'ẢNH':'VIDEO'} · ${size(item.size||0)}`;info.append(nm,meta);const tools=document.createElement('div');tools.className='tile-tools';[['Đổi tên',()=>openRename(item)],['Lên',()=>moveItem(item,-1)],['Xuống',()=>moveItem(item,1)],['Xóa',()=>removeItem(item)]].forEach(([label,fn])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.setAttribute('aria-label',`${label} ${item.name||'tệp'}`);b.onclick=e=>{e.stopPropagation();fn()};tools.append(b)});tile.append(open,info,tools);return tile}
    async function moveItem(item,direction){const list=[...viewerItems],i=list.findIndex(x=>x.key===item.key),j=i+direction;if(j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];const updates={};list.forEach((x,n)=>updates[`${x.key}/position`]=n);try{await db.ref(`media/${user.uid}`).update(updates);ui.sort.value='custom';setStatus('Đã cập nhật thứ tự.','success')}catch(e){setStatus(`Không lưu được thứ tự: ${readableError(e)}`,'error')}}
    function openViewer(index){viewerIndex=index;lastFocus=document.activeElement;showViewer();$('closeViewer').focus()}
    function showViewer(){const item=viewerItems[viewerIndex];if(!item)return;ui.viewerMedia.replaceChildren();const el=document.createElement(kind(item)==='image'?'img':'video');el.className='viewer-content';el.src=item.url;if(kind(item)==='image'){el.alt=item.name||'Ảnh'}else{el.controls=true;el.playsInline=true;el.preload='metadata'}ui.viewerMedia.append(el);ui.caption.textContent=`${item.name||'Tệp'} · ${viewerIndex+1}/${viewerItems.length}`;ui.viewer.classList.add('open');ui.viewer.setAttribute('aria-hidden','false');const nav=viewerItems.length>1; $('prev').hidden=!nav;$('next').hidden=!nav}
    function stepViewer(direction){if(viewerItems.length<2)return;viewerIndex=(viewerIndex+direction+viewerItems.length)%viewerItems.length;showViewer()}
    function closeViewer(){ui.viewer.classList.remove('open');ui.viewer.setAttribute('aria-hidden','true');ui.viewerMedia.replaceChildren();if(lastFocus&&lastFocus.isConnected)lastFocus.focus();lastFocus=null}
    function onKey(e){if(ui.viewer.classList.contains('open')){if(e.key==='Escape'){closeViewer();e.preventDefault();return}if(e.key==='ArrowLeft'){stepViewer(-1);e.preventDefault();return}if(e.key==='ArrowRight'){stepViewer(1);e.preventDefault();return}if(e.key==='Tab'){const focusables=[...ui.viewer.querySelectorAll('button:not([hidden])')];if(e.shiftKey&&document.activeElement===focusables[0]){e.preventDefault();focusables.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===focusables.at(-1)){e.preventDefault();focusables[0].focus()}}}else if(e.key==='Escape'){closeMusic();closeRename()}}
    function toggleMusic(){const open=!ui.music.classList.contains('open');ui.music.classList.toggle('open',open);$('musicButton').setAttribute('aria-expanded',String(open));if(open)renderMusic()}
    function closeMusic(){ui.music.classList.remove('open');$('musicButton').setAttribute('aria-expanded','false')}
    function renderMusic(){ui.music.replaceChildren();const list=items.filter(x=>x.mode==='audio'||kind(x)==='audio').sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));if(!list.length){ui.music.textContent='Chưa có nhạc. Chọn “Nhạc” ở phần Thêm tệp.';return}list.forEach(item=>{const row=document.createElement('div');row.className='song';const audio=document.createElement('audio');audio.controls=true;audio.preload='none';audio.src=item.url;audio.setAttribute('aria-label',`Phát ${item.name||'âm thanh'}`);const name=document.createElement('span');name.className='song-name';name.textContent=item.name||'Âm thanh';const del=document.createElement('button');del.className='btn danger';del.type='button';del.textContent='Xóa';del.setAttribute('aria-label',`Xóa ${item.name||'âm thanh'}`);del.onclick=()=>removeItem(item);row.append(audio,name,del);ui.music.append(row)})}
    async function removeItem(item){if(deleteTimer){clearTimeout(deleteTimer);await permanentlyDelete(deletedItem)}try{await db.ref(`media/${user.uid}/${item.key}`).remove();deletedItem=item;ui.toast.classList.add('open');$('toastText').textContent=`Đã chuyển “${item.name||'tệp'}” vào thao tác có thể hoàn tác.`;$('undoDelete').hidden=false;deleteTimer=setTimeout(async()=>{await permanentlyDelete(item)},8000)}catch(e){setStatus(`Không xóa được: ${readableError(e)}`,'error')}}
    async function permanentlyDelete(item){if(!item)return;clearTimeout(deleteTimer);deleteTimer=null;deletedItem=null;ui.toast.classList.remove('open');if(item.storagePath){try{await firebase.storage().ref(item.storagePath).delete()}catch(e){console.warn('Không xóa được object Storage:',e)}}}
    async function undoDelete(){if(!deletedItem)return;clearTimeout(deleteTimer);deleteTimer=null;const item=deletedItem;deletedItem=null;ui.toast.classList.remove('open');try{const data={...item};delete data.key;await db.ref(`media/${user.uid}/${item.key}`).set(data);setStatus('Đã hoàn tác thao tác xóa.','success')}catch(e){setStatus(`Không thể hoàn tác: ${readableError(e)}`,'error')}}
    function openRename(item){renameTarget=item;$('nameInput').value=(item.name||'').replace(/\.[^.]+$/,'');$('nameBackdrop').classList.add('open');$('nameInput').focus();$('nameInput').select()}
    function closeRename(){if(!$('nameBackdrop').classList.contains('open'))return;$('nameBackdrop').classList.remove('open');renameTarget=null}
    async function saveRename(){if(!renameTarget)return;const name=safeName($('nameInput').value);if(!name||name==='Tệp'){setStatus('Tên tệp không được để trống.','error');return}try{await db.ref(`media/${user.uid}/${renameTarget.key}`).update({name});closeRename();setStatus('Đã đổi tên tệp.','success')}catch(e){setStatus(`Không đổi được tên: ${readableError(e)}`,'error')}}
    function formatError(error){return error&&error.code==='storage/canceled'?'Đã hủy tải lên.':readableError(error)}
    window.addEventListener('beforeunload',()=>{if(uploadTask)uploadTask.cancel();if(deleteTimer&&deletedItem)permanentlyDelete(deletedItem)});
    init();
  })();
  </script>
</body>
</html>

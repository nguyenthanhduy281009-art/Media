<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101828">
  <title>MediaVault — Thư viện của bạn</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
  <style>
    :root{--bg:#f5f7fb;--surface:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--primary:#7f56d9;--primary-dark:#6941c6;--danger:#d92d20;--radius:18px;--shadow:0 12px 35px rgba(16,24,40,.08)}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#f8faff,#f3f4ff);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} button,input{font:inherit} button{cursor:pointer}
    .app{max-width:1180px;margin:0 auto;padding:28px 18px 48px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;gap:12px;align-items:center}.brand-mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:900;background:linear-gradient(135deg,#7f56d9,#f04438);box-shadow:0 8px 18px rgba(127,86,217,.25)}.brand h1{font-size:21px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}.top-actions{display:flex;gap:9px;align-items:center}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700;transition:.2s}.btn-primary{color:#fff;background:var(--primary)}.btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px)}.btn-ghost{color:var(--ink);background:#fff;border:1px solid var(--line)}.btn-ghost:hover{background:#f9fafb}.btn-danger{color:#fff;background:var(--danger)}
    .hero{display:grid;grid-template-columns:1.4fr .8fr;gap:18px;margin-bottom:20px}.upload-panel,.stats-panel,.toolbar{background:var(--surface);border:1px solid rgba(228,231,236,.8);border-radius:var(--radius);box-shadow:var(--shadow)}.upload-panel{padding:22px}.upload-panel h2{font-size:19px;margin:0 0 6px}.upload-panel p{color:var(--muted);font-size:14px;margin:0 0 18px}.upload-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.file-label{flex:1;min-width:220px;border:1.5px dashed #b9a5eb;background:#faf8ff;color:var(--primary-dark);border-radius:12px;padding:11px 13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-label input{display:none}.status{width:100%;min-height:20px;color:var(--primary-dark);font-size:13px;font-weight:600;margin-top:10px}.stats-panel{padding:22px;display:flex;flex-direction:column;justify-content:center}.stats-label{font-size:13px;color:var(--muted)}.stats-number{font-size:40px;line-height:1.1;font-weight:800;margin:4px 0}.stats-detail{font-size:13px;color:var(--muted)}
    .toolbar{display:flex;align-items:center;gap:10px;padding:12px;margin-bottom:20px}.search{flex:1;min-width:150px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0}.search:focus{border-color:var(--primary);box-shadow:0 0 0 3px #ede9fe}.select{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:var(--ink)}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.media-card{position:relative;overflow:hidden;background:#111827;border-radius:15px;min-height:210px;box-shadow:0 8px 20px rgba(16,24,40,.12);cursor:pointer}.media-card:focus-visible{outline:3px solid #a78bfa;outline-offset:3px}.media-card img,.media-card video{width:100%;height:210px;display:block;object-fit:cover}.media-card audio{width:calc(100% - 24px);margin:90px 12px 0}.audio-art{height:210px;display:grid;place-items:center;font-size:48px;color:#c4b5fd;background:linear-gradient(135deg,#22154c,#101828)}.card-info{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.8));font-size:12px}.card-info span{opacity:.78}.delete-btn{position:absolute;top:9px;right:9px;border:0;border-radius:8px;padding:7px 9px;color:#fff;background:rgba(16,24,40,.72);opacity:0;transition:.2s;z-index:2}.media-card:hover .delete-btn,.media-card:focus-within .delete-btn{opacity:1}.empty{grid-column:1/-1;text-align:center;padding:65px 20px;color:var(--muted);border:1px dashed #cfd4dc;border-radius:var(--radius);background:rgba(255,255,255,.6)}.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
    .music-wrap{position:relative}.music-list{display:none;position:absolute;right:0;top:46px;width:290px;max-height:330px;overflow:auto;padding:8px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:20}.music-list.open{display:block}.music-item{display:flex;align-items:center;gap:8px;padding:10px;border-radius:8px}.music-item:hover{background:#f9fafb}.music-play{flex:1;border:0;background:transparent;text-align:left;color:var(--ink);font-size:13px}.music-delete{border:0;background:#fee4e2;color:var(--danger);border-radius:6px;padding:5px 7px;font-size:12px}
    .modal{display:none;position:fixed;inset:0;background:rgba(3,7,18,.94);z-index:100;align-items:center;justify-content:center}.modal.open{display:flex}.viewer{width:100%;height:100%;display:grid;place-items:center;overflow:hidden;touch-action:none}.viewer img,.viewer video{max-width:92vw;max-height:88vh;object-fit:contain;transform-origin:center;user-select:none}.viewer audio{width:min(500px,85vw)}.modal-close,.nav-btn{position:absolute;z-index:3;border:0;color:#fff;background:rgba(255,255,255,.14);border-radius:50%;width:44px;height:44px;font-size:25px}.modal-close{top:22px;right:24px}.nav-btn{top:50%;transform:translateY(-50%);font-size:30px}.prev{left:24px}.next{right:24px}.modal-close:hover,.nav-btn:hover{background:rgba(255,255,255,.27)}
    @media(max-width:700px){.app{padding:18px 12px 36px}.topbar{align-items:flex-start}.top-actions{flex-wrap:wrap;justify-content:flex-end}.hero{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}.select{flex:1}.delete-btn{opacity:1}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.media-card,.media-card img,.media-card video,.audio-art{min-height:160px;height:160px}.media-card audio{margin-top:65px}.nav-btn{width:38px;height:38px;font-size:23px}.prev{left:8px}.next{right:8px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">M</div><div><h1>MediaVault</h1><p>Không gian lưu trữ riêng tư của bạn</p></div></div>
      <div class="top-actions"><div class="music-wrap"><button class="btn btn-ghost" id="musicToggle" type="button">Nhạc</button><div id="musicList" class="music-list" aria-label="Danh sách nhạc"></div></div><button class="btn btn-ghost" id="logoutBtn" type="button">Đăng xuất</button></div>
    </header>
    <section class="hero">
      <div class="upload-panel"><h2>Thêm tệp mới</h2><p>Hỗ trợ hình ảnh, video và âm thanh. Tệp được lưu riêng theo tài khoản của bạn.</p><div class="upload-row"><label class="file-label" id="fileLabel"><span>Chọn một tệp…</span><input type="file" id="fileInput" accept="image/*,video/*,audio/*"></label><button class="btn btn-primary" id="uploadBtn" type="button">Tải lên</button></div><div id="status" class="status" role="status" aria-live="polite"></div></div>
      <div class="stats-panel"><span class="stats-label">Tổng số tệp</span><strong class="stats-number" id="totalCount">0</strong><span class="stats-detail" id="statsDetail">Chưa có tệp nào</span></div>
    </section>
    <section class="toolbar"><input class="search" id="searchInput" type="search" placeholder="Tìm theo loại tệp…" aria-label="Tìm kiếm media"><select class="select" id="filterSelect" aria-label="Lọc media"><option value="all">Tất cả</option><option value="image">Hình ảnh</option><option value="video">Video</option><option value="audio">Âm thanh</option></select><select class="select" id="sortSelect" aria-label="Sắp xếp"><option value="newest">Mới nhất</option><option value="oldest">Cũ nhất</option></select></section>
    <section class="gallery" id="gallery" aria-live="polite"></section>
  </main>
  <div id="mediaModal" class="modal" role="dialog" aria-modal="true" aria-label="Trình xem media"><button class="modal-close" id="closeModal" aria-label="Đóng">×</button><button class="nav-btn prev" id="prevBtn" aria-label="Tệp trước">‹</button><div class="viewer" id="modalViewer"></div><button class="nav-btn next" id="nextBtn" aria-label="Tệp tiếp theo">›</button></div>
<script>
  const firebaseConfig={apiKey:"AIzaSyCmLLI3wHywsLB33QmJDSgUzQcfS3GJgso",authDomain:"haha-ba0bc.firebaseapp.com",projectId:"haha-ba0bc",storageBucket:"haha-ba0bc.firebasestorage.app",messagingSenderId:"748739861694",appId:"1:748739861694:web:492d2a164fec150840d2ef",measurementId:"G-DFQ8DYRZ1G",databaseURL:"https://haha-ba0bc-default-rtdb.asia-southeast1.firebasedatabase.app"};
  if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db=firebase.database(),storage=firebase.storage(); let currentUser=null,mediaList=[],visibleList=[],currentIndex=-1,currentAudio=new Audio(),dragging=false,startX=0,startY=0,posX=0,posY=0,scale=1;
  const $=id=>document.getElementById(id); const status=(text,error=false)=>{ $("status").textContent=text; $("status").style.color=error?"var(--danger)":"var(--primary-dark)"; };
  firebase.auth().onAuthStateChanged(user=>{if(!user){location.replace("index.html");return}currentUser=user;loadMedia()});
  $("logoutBtn").onclick=()=>firebase.auth().signOut(); $("musicToggle").onclick=()=>{$("musicList").classList.toggle("open");renderMusicList()};
  $("fileInput").onchange=e=>{$("fileLabel").querySelector("span").textContent=e.target.files[0]?.name||"Chọn một tệp…"}; $("uploadBtn").onclick=uploadFile;
  $("searchInput").oninput=renderGallery; $("filterSelect").onchange=renderGallery; $("sortSelect").onchange=renderGallery;
  function loadMedia(){db.ref(`media/${currentUser.uid}`).on("value",snap=>{mediaList=[];snap.forEach(child=>{const d=child.val();if(d.url&&d.type)mediaList.push({key:child.key,...d})});mediaList.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));renderGallery();renderMusicList()})}
  async function uploadFile(){const input=$("fileInput"),file=input.files[0];if(!file)return status("Vui lòng chọn tệp trước.",true);if(file.size>100*1024*1024)return status("Tệp vượt quá giới hạn 100 MB.",true);if(!/^(image|video|audio)\//.test(file.type))return status("Định dạng tệp không được hỗ trợ.",true);const btn=$("uploadBtn");btn.disabled=true;status("Đang tải lên…");try{const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");const ref=storage.ref(`media/${currentUser.uid}/${Date.now()}_${safeName}`);const task=ref.put(file,{contentType:file.type});task.on("state_changed",s=>status(`Đang tải lên… ${Math.round(s.bytesTransferred/s.totalBytes*100)}%`));await task;const url=await ref.getDownloadURL();await db.ref(`media/${currentUser.uid}`).push({url,type:file.type,name:file.name,size:file.size,storagePath:ref.fullPath,createdAt:firebase.database.ServerValue.TIMESTAMP});status("Tải lên thành công.");input.value="";$("fileLabel").querySelector("span").textContent="Chọn một tệp…"}catch(e){console.error(e);status("Không thể tải tệp lên. Hãy kiểm tra cấu hình Firebase Storage.",true)}finally{btn.disabled=false}}
  function typeOf(item){return item.type.split("/")[0]}
  function renderGallery(){const q=$("searchInput").value.trim().toLowerCase(),filter=$("filterSelect").value,sort=$("sortSelect").value;visibleList=mediaList.filter(x=>(filter==="all"||typeOf(x)===filter)&&(!q||(x.name||x.type).toLowerCase().includes(q)));if(sort==="oldest")visibleList.reverse();$("totalCount").textContent=mediaList.length;$("statsDetail").textContent=`${mediaList.filter(x=>typeOf(x)==="image").length} ảnh · ${mediaList.filter(x=>typeOf(x)==="video").length} video · ${mediaList.filter(x=>typeOf(x)==="audio").length} âm thanh`;const gallery=$("gallery");gallery.replaceChildren();if(!visibleList.length){const empty=document.createElement("div");empty.className="empty";empty.innerHTML="<strong>Chưa có media phù hợp</strong><span>Hãy tải lên tệp đầu tiên hoặc thử thay đổi bộ lọc.</span>";gallery.appendChild(empty);return}visibleList.forEach(item=>{const card=document.createElement("article");card.className="media-card";card.tabIndex=0;const kind=typeOf(item);if(kind==="image"){const el=document.createElement("img");el.src=item.url;el.alt=item.name||"Hình ảnh";el.loading="lazy";card.appendChild(el)}else if(kind==="video"){const el=document.createElement("video");el.src=item.url;el.muted=true;el.preload="metadata";card.appendChild(el)}else{const art=document.createElement("div");art.className="audio-art";art.textContent="♫";card.appendChild(art)}const info=document.createElement("div");info.className="card-info";info.innerHTML=`<b>${escapeHtml(item.name||"Tệp không tên")}</b><br><span>${kind.toUpperCase()}</span>`;card.appendChild(info);const del=document.createElement("button");del.className="delete-btn";del.textContent="Xóa";del.onclick=e=>{e.stopPropagation();deleteFile(item)};card.appendChild(del);const open=()=>openModal(item);card.onclick=open;card.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}};gallery.appendChild(card)})}
  function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  function renderMusicList(){const list=$("musicList");list.replaceChildren();const audio=mediaList.filter(x=>typeOf(x)==="audio");if(!audio.length){list.textContent="Chưa có tệp âm thanh.";return}audio.forEach(item=>{const row=document.createElement("div");row.className="music-item";const play=document.createElement("button");play.className="music-play";play.textContent=`♫ ${item.name||"Tệp âm thanh"}`;play.onclick=()=>{if(currentAudio.src===item.url&&!currentAudio.paused){currentAudio.pause()}else{currentAudio.src=item.url;currentAudio.play().catch(()=>status("Trình duyệt cần thao tác của bạn để phát âm thanh.",true))}};const del=document.createElement("button");del.className="music-delete";del.textContent="Xóa";del.onclick=()=>deleteFile(item);row.append(play,del);list.appendChild(row)})}
  async function deleteFile(item){if(!confirm(`Xóa “${item.name||"tệp này"}”?`))return;try{await db.ref(`media/${currentUser.uid}/${item.key}`).remove();if(item.storagePath)await storage.ref(item.storagePath).delete().catch(()=>{});status("Đã xóa tệp.")}catch(e){status("Không thể xóa tệp.",true)}}
  function openModal(item){currentIndex=visibleList.indexOf(item);scale=1;posX=0;posY=0;const viewer=$("modalViewer");viewer.replaceChildren();const kind=typeOf(item);let el;if(kind==="image"){el=document.createElement("img");el.alt=item.name||"Hình ảnh"}else if(kind==="video"){el=document.createElement("video");el.controls=true;el.autoplay=true;el.loop=true}else{el=document.createElement("audio");el.controls=true;el.autoplay=true}el.src=item.url;el.id="viewEl";viewer.appendChild(el);$("mediaModal").classList.add("open");updateTransform();if(kind!=="audio")enablePan(viewer,el)}
  function enablePan(viewer,el){viewer.onpointerdown=e=>{dragging=true;startX=e.clientX-posX;startY=e.clientY-posY;viewer.setPointerCapture(e.pointerId)};viewer.onpointermove=e=>{if(!dragging)return;posX=e.clientX-startX;posY=e.clientY-startY;updateTransform()};viewer.onpointerup=()=>dragging=false;viewer.onwheel=e=>{e.preventDefault();scale=Math.max(.5,Math.min(3,scale-e.deltaY*.001));updateTransform()}}
  function updateTransform(){const el=$("viewEl");if(el)el.style.transform=`translate(${posX}px,${posY}px) scale(${scale})`}
  function changeMedia(step){if(!visibleList.length)return;currentIndex=(currentIndex+step+visibleList.length)%visibleList.length;openModal(visibleList[currentIndex])}
  function closeModal(){const video=$("modalViewer video");if(video)video.pause();$("mediaModal").classList.remove("open");$("modalViewer").replaceChildren()}
  $("closeModal").onclick=closeModal;$("prevBtn").onclick=()=>changeMedia(-1);$("nextBtn").onclick=()=>changeMedia(1);$("mediaModal").onclick=e=>{if(e.target.id==="mediaModal")closeModal()};document.onkeydown=e=>{if(!$("mediaModal").classList.contains("open"))return;if(e.key==="Escape")closeModal();if(e.key==="ArrowLeft")changeMedia(-1);if(e.key==="ArrowRight")changeMedia(1)};
</script>
</body>
</html>

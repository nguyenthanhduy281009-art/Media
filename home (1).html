<style>
:root{--bg:#f6f7fb;--surface:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--primary:#7f56d9;--primary-dark:#6941c6;--danger:#d92d20;--success:#039855;--shadow:0 10px 30px #10182812}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#fafaff,#f1efff)}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1200px;margin:auto;padding:24px 18px 52px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:11px}.logo{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;color:#fff;font-weight:900;background:linear-gradient(135deg,var(--primary),#f04438);box-shadow:0 7px 16px #7f56d933}.brand h1{font-size:22px;margin:0;letter-spacing:-.02em}.brand p{font-size:12px;color:var(--muted);margin:3px 0 0}.actions{display:flex;align-items:center;gap:9px;position:relative}.btn{border:1px solid var(--line);border-radius:11px;padding:10px 14px;font-weight:700;font-size:14px;background:#fff;color:var(--ink);transition:.2s}.btn:hover{background:#f9fafb;border-color:#cfd4dc}.btn-primary{border-color:var(--primary);background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}.btn-danger{color:var(--danger)}.btn-danger:hover{background:#fef3f2;border-color:#fda29b}.btn:disabled{opacity:.55;cursor:not-allowed}.hero{display:grid;grid-template-columns:1.45fr .55fr;gap:18px;margin-bottom:20px}.panel,.toolbar{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.panel{padding:22px}.upload-panel h2{font-size:19px;margin:0 0 5px}.upload-panel p{font-size:13px;color:var(--muted);margin:0 0 17px}.upload-controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px}.picker{flex:1;min-width:220px;position:relative;display:block;padding:11px 14px;border:1.5px dashed #b9a5eb;border-radius:11px;text-align:center;color:var(--primary-dark);background:#fbfaff;cursor:pointer;overflow:hidden}.picker:hover{border-color:var(--primary);background:#f7f4ff}.picker input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.file-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hint,.status{width:100%;font-size:12px;margin-top:8px}.hint{color:var(--muted)}.status{min-height:19px;color:var(--primary-dark);font-weight:700}.status.error{color:var(--danger)}.progress-wrap{display:none;width:100%;height:7px;margin-top:13px;overflow:hidden;border-radius:5px;background:#eaecf0}.progress-wrap.visible{display:block}.progress-bar{width:0;height:100%;background:var(--primary);transition:width .15s}.stat-panel{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.stat-label{font-size:13px;color:var(--muted)}.stat-number{font-size:43px;font-weight:850;line-height:1;margin:8px 0}.stat-detail{font-size:13px;color:var(--muted)}.toolbar{display:flex;align-items:center;gap:10px;padding:12px;margin-bottom:20px}.search{flex:1;min-width:160px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0}.search:focus{border-color:var(--primary);box-shadow:0 0 0 3px #ede9fe}.select{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:var(--ink)}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px}.media-card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:var(--shadow);cursor:pointer;transition:.2s}.media-card:hover{transform:translateY(-3px);box-shadow:0 14px 27px #1018281c}.preview{height:190px;display:grid;place-items:center;background:#101828;overflow:hidden}.preview img,.preview video{display:block;width:100%;height:100%;object-fit:cover}.preview-placeholder{font-size:38px;color:#98a2b3}.media-info{padding:11px 13px}.media-name{margin:0;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.media-meta{display:flex;justify-content:space-between;gap:8px;margin-top:4px;font-size:11px;color:var(--muted)}.card-delete{position:absolute;right:8px;top:8px;width:33px;height:33px;border:0;border-radius:9px;color:#fff;background:#101828bb;opacity:0;transition:.2s}.media-card:hover .card-delete,.media-card:focus-within .card-delete{opacity:1}.empty{grid-column:1/-1;padding:70px 20px;text-align:center;border:1px dashed #cfd4dc;border-radius:18px;color:var(--muted)}.empty strong{display:block;margin-bottom:5px;font-size:18px;color:var(--ink)}.music-popover{display:none;position:absolute;right:0;top:48px;width:min(330px,calc(100vw - 24px));max-height:390px;overflow:auto;padding:10px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 20px 40px #10182820;z-index:20}.music-popover.open{display:block}.music-title{margin:2px 5px 8px;font-size:14px}.music-row{display:flex;align-items:center;gap:8px;padding:9px;border-radius:9px}.music-row:hover{background:#f8f9fc}.music-play{flex:1;min-width:0;border:0;background:transparent;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--ink)}.music-remove{border:0;border-radius:6px;padding:5px 7px;color:var(--danger);background:#fee4e2;font-size:11px}.modal{display:none;position:fixed;inset:0;z-index:100;background:#030712f7;color:#fff;flex-direction:column}.modal.open{display:flex}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;z-index:2}.modal-title{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.modal-close{width:40px;height:40px;border:0;border-radius:50%;color:#fff;background:#ffffff1f;font-size:25px}.viewer{position:relative;flex:1;display:grid;place-items:center;overflow:hidden;touch-action:none}.viewer img,.viewer video{max-width:94vw;max-height:85vh;object-fit:contain;transform-origin:center;user-select:none}.viewer audio{width:min(510px,88vw)}.nav{position:absolute;top:50%;z-index:2;width:45px;height:45px;border:0;border-radius:50%;color:#fff;background:#ffffff1f;font-size:30px;transform:translateY(-50%)}.nav:hover{background:#ffffff38}.nav.prev{left:19px}.nav.next{right:19px}.modal-foot{display:flex;align-items:center;justify-content:center;gap:18px;padding:15px;z-index:2}.counter{min-width:56px;padding:5px 10px;border-radius:18px;text-align:center;font-size:13px;background:#ffffff1f}.zoom-tools{display:flex;align-items:center;gap:3px;padding:4px;border-radius:10px;background:#ffffff18}.zoom-tools button{border:0;border-radius:7px;padding:6px 10px;color:#fff;background:transparent}.zoom-tools button:hover{background:#ffffff1f}.zoom-value{min-width:45px;text-align:center;font-size:12px}@media(max-width:800px){.app{padding:17px 12px 40px}.hero{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.preview{height:155px}.nav{display:none}.zoom-tools{display:none}.modal-foot{padding-bottom:20px}}@media(max-width:500px){.topbar{align-items:flex-start}.brand h1{font-size:19px}.logo{width:38px;height:38px;font-size:18px}.actions{gap:5px}.btn{padding:8px 10px;font-size:12px}.gallery{grid-template-columns:1fr}.preview{height:205px}.upload-controls .btn{flex:1}.picker{min-width:100%}.modal-head{padding:10px}.modal-foot{gap:9px}}
</style>

<body>
<main class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">M</div><div><h1>MediaVault</h1><p>Không gian lưu trữ cá nhân</p></div></div>
    <div class="actions"><button class="btn" id="musicBtn" type="button">Nhạc</button><div class="music-popover" id="musicPopover" aria-label="Danh sách nhạc"></div><button class="btn btn-danger" id="logoutBtn" type="button">Đăng xuất</button></div>
  </header>
  <section class="hero">
    <div class="panel upload-panel">
      <h2>Tải tệp lên</h2><p>Chọn một tệp, sau đó chọn cách lưu phù hợp. Ảnh/video vào thư viện; âm thanh vào Nhạc.</p>
      <div class="upload-controls"><label class="picker" id="dropZone"><span class="file-name" id="fileName">Nhấn để chọn tệp</span><input id="fileInput" type="file" accept="image/*,video/*,audio/*"></label><button class="btn btn-primary" id="uploadBtn" type="button">Tải ảnh/video</button><button class="btn" id="uploadAudioBtn" type="button">Tải âm thanh</button></div>
      <div class="hint">Giới hạn bản miễn phí: tối đa 12 MB/tệp khi lưu bằng Realtime Database.</div><div class="progress-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div><div class="status" id="status" role="status" aria-live="polite"></div>
    </div>
    <div class="panel stat-panel"><span class="stat-label">Ảnh và video</span><strong class="stat-number" id="totalCount">0</strong><span class="stat-detail" id="statDetail">Đang tải dữ liệu...</span></div>
  </section>
  <section class="toolbar"><input class="search" id="searchInput" type="search" placeholder="Tìm theo tên tệp..." aria-label="Tìm kiếm"><select class="select" id="filterSelect" aria-label="Lọc"><option value="all">Tất cả</option><option value="image">Hình ảnh</option><option value="video">Video</option></select><select class="select" id="sortSelect" aria-label="Sắp xếp"><option value="new">Mới nhất</option><option value="old">Cũ nhất</option><option value="name">Tên A-Z</option></select></section>
  <section class="gallery" id="gallery" aria-live="polite"></section>
</main>
<div class="modal" id="mediaModal" role="dialog" aria-modal="true" aria-label="Trình xem media"><div class="modal-head"><button class="modal-close" id="closeModal" type="button" aria-label="Đóng">×</button><div class="modal-title" id="modalTitle"></div><div style="width:40px"></div></div><div class="viewer" id="viewer"><button class="nav prev" id="prevBtn" type="button" aria-label="Tệp trước">‹</button><div id="viewerMain" style="width:100%;height:100%;display:grid;place-items:center"></div><button class="nav next" id="nextBtn" type="button" aria-label="Tệp tiếp theo">›</button></div><div class="modal-foot"><span class="counter" id="counter">0/0</span><div class="zoom-tools"><button id="zoomOut" type="button">−</button><span class="zoom-value" id="zoomValue">100%</span><button id="zoomIn" type="button">＋</button><button id="zoomReset" type="button">Đặt lại</button></div><button class="btn" id="downloadBtn" type="button">Tải xuống</button></div></div>
<script>
(function(){
  const firebaseConfig={apiKey:"AIzaSyCmLLI3wHywsLB33QmJDSgUzQcfS3GJgso",authDomain:"haha-ba0bc.firebaseapp.com",projectId:"haha-ba0bc",messagingSenderId:"748739861694",appId:"1:748739861694:web:492d2a164fec150840d2ef",measurementId:"G-DFQ8DYRZ1G",databaseURL:"https://haha-ba0bc-default-rtdb.asia-southeast1.firebasedatabase.app"};
  if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
  const auth=firebase.auth(),db=firebase.database(),MAX_BYTES=12*1024*1024;
  let currentUser=null,allMedia=[],filtered=[],currentIndex=-1,currentAudio=new Audio();
  let uploadReader=null,uploadCancelled=false,scale=1,translateX=0,translateY=0,gesturePointers=new Map(),gestureStartDistance=0,gestureStartScale=1,gestureStartX=0,gestureStartY=0,gestureLastTap=0,gestureMoved=false;
  const $=id=>document.getElementById(id),typeOf=item=>String(item.type||'').split('/')[0];
  const setStatus=(text,error=false)=>{const el=$("status");el.textContent=text;el.classList.toggle('error',error)};
  const formatSize=bytes=>{if(!Number.isFinite(Number(bytes))||Number(bytes)<=0)return '—';const units=['B','KB','MB','GB'];let i=Math.min(units.length-1,Math.floor(Math.log(bytes)/Math.log(1024)));return `${(bytes/Math.pow(1024,i)).toFixed(i?1:0)} ${units[i]}`};
  const formatDate=value=>{const time=Number(value);if(!time)return 'Chưa rõ thời gian';try{return new Intl.DateTimeFormat('vi-VN',{dateStyle:'short',timeStyle:'short'}).format(new Date(time))}catch(_){return 'Chưa rõ thời gian'}};
  const escapeHtml=text=>{const node=document.createElement('span');node.textContent=String(text||'');return node.innerHTML};
  
  auth.onAuthStateChanged(user=>{if(!user){location.replace('index.html');return}currentUser=user;listenMedia()});
  $("logoutBtn").onclick=()=>auth.signOut();
  
  function listenMedia(){db.ref(`media/${currentUser.uid}`).on('value',snapshot=>{allMedia=[];snapshot.forEach(child=>{const data=child.val();if(data&&data.url&&data.type)allMedia.push({id:child.key,...data})});allMedia.sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));applyFilters();renderMusicList();updateStats()},error=>setStatus(`Không thể đọc thư viện: ${error.message||'lỗi cơ sở dữ liệu'}`,true))}
  function updateStats(){const images=allMedia.filter(x=>typeOf(x)==='image').length,videos=allMedia.filter(x=>typeOf(x)==='video').length,audios=allMedia.filter(x=>typeOf(x)==='audio').length;$("totalCount").textContent=images+videos;$("statDetail").textContent=`${images} ảnh · ${videos} video · ${audios} âm thanh trong Nhạc`}
  
  $("fileInput").onchange=e=>{const file=e.target.files[0];$("fileName").textContent=file?file.name:'Nhấn để chọn tệp';setStatus('')};
  const dropZone=$("dropZone");['dragenter','dragover'].forEach(name=>dropZone.addEventListener(name,e=>{e.preventDefault();dropZone.style.borderColor='var(--primary)'}));['dragleave','drop'].forEach(name=>dropZone.addEventListener(name,e=>{e.preventDefault();dropZone.style.borderColor=''}));dropZone.addEventListener('drop',e=>{const file=e.dataTransfer.files[0];if(file){const transfer=new DataTransfer();transfer.items.add(file);$("fileInput").files=transfer.files;$("fileName").textContent=file.name}});
  $("uploadBtn").onclick=()=>handleUpload('normal');$("uploadAudioBtn").onclick=()=>handleUpload('audio');
  
  async function handleUpload(mode){const input=$("fileInput"),file=input.files[0],button=mode==='audio'?$("uploadAudioBtn"):$("uploadBtn");if(!file)return setStatus('Vui lòng chọn tệp trước.',true);const accepts=mode==='audio'?/^(audio|video)\//:/^(image|video)\//;if(!accepts.test(file.type))return setStatus(mode==='audio'?'Nút này nhận file âm thanh hoặc video.':'Nút này nhận hình ảnh hoặc video.',true);if(file.size>MAX_BYTES)return setStatus(`Tệp vượt quá giới hạn ${formatSize(MAX_BYTES)} của chế độ miễn phí.`,true);toggleBusy(true);uploadCancelled=false;try{let output=file;if(mode==='audio'&&file.type.startsWith('video/'))output=await extractAudio(file);setStatus('Đang đọc tệp để lưu...');const dataUrl=await readAsDataUrl(output);if(uploadCancelled)throw new Error('Đã hủy thao tác');await db.ref(`media/${currentUser.uid}`).push({url:dataUrl,name:output.name,type:output.type,size:output.size,mode,createdAt:firebase.database.ServerValue.TIMESTAMP});setStatus(mode==='audio'?'Đã lưu trong danh sách Nhạc.':'Đã lưu trong thư viện.');input.value='';$("fileName").textContent='Nhấn để chọn tệp'}catch(error){if(error.message!=='Đã hủy thao tác')setStatus(`Không thể lưu tệp: ${error.message||'lỗi không xác định'}`,true)}finally{toggleBusy(false)}}
  function readAsDataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader();uploadReader=reader;reader.onprogress=e=>{if(e.lengthComputable){const percent=Math.round(e.loaded/e.total*100);$("progressBar").style.width=percent+'%';setStatus(`Đang chuẩn bị dữ liệu: ${percent}%`)}};reader.onload=()=>{uploadReader=null;resolve(reader.result)};reader.onerror=()=>{uploadReader=null;reject(new Error('Không đọc được tệp'))};reader.onabort=()=>{uploadReader=null;reject(new Error('Đã hủy thao tác'))};reader.readAsDataURL(file)})}
  
  function extractAudio(videoFile){return new Promise((resolve,reject)=>{const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!window.MediaRecorder||!AudioContextClass)return reject(new Error('Trình duyệt không hỗ trợ tách âm thanh'));const video=document.createElement('video'),objectUrl=URL.createObjectURL(video),context=new AudioContextClass();let finished=false;const cleanup=()=>{if(finished)return;finished=true;URL.revokeObjectURL(objectUrl);context.close().catch(()=>{})};video.src=objectUrl;video.preload='auto';video.playsInline=true;video.onloadedmetadata=async()=>{try{await context.resume();const source=context.createMediaElementSource(video),destination=context.createMediaStreamDestination();source.connect(destination);const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm',recorder=new MediaRecorder(destination.stream,{mimeType:mime}),chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:mime});cleanup();resolve(new File([blob],videoFile.name.replace(/\.[^.]+$/i,'.webm'),{type:'audio/webm'}))};video.ontimeupdate=()=>{if(video.duration) setStatus(`Đang tách âm thanh: ${Math.round(video.currentTime/video.duration*100)}%`)};video.onended=()=>{if(recorder.state!=='inactive')recorder.stop()};recorder.start(250);await video.play()}catch(error){cleanup();reject(error)}};video.onerror=()=>{cleanup();reject(new Error('Không thể đọc file video'))}})}
  function toggleBusy(busy){$("uploadBtn").disabled=busy;$("uploadAudioBtn").disabled=busy;$("fileInput").disabled=busy;$("progressWrap").classList.toggle('visible',busy);if(!busy){$("progressBar").style.width='0%';uploadReader=null}}
  
  $("searchInput").oninput=applyFilters;$("filterSelect").onchange=applyFilters;$("sortSelect").onchange=applyFilters;
  function applyFilters(){const query=$("searchInput").value.trim().toLowerCase(),filter=$("filterSelect").value,sort=$("sortSelect").value;filtered=allMedia.filter(item=>{const kind=typeOf(item);return (kind==='image'||kind==='video')&&(!query||String(item.name||'').toLowerCase().includes(query))&&(filter==='all'||kind===filter)});if(sort==='old')filtered.sort((a,b)=>Number(a.createdAt||0)-Number(b.createdAt||0));else if(sort==='name')filtered.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'vi'));else filtered.sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));renderGallery()}
  function renderGallery(){const gallery=$("gallery");gallery.replaceChildren();if(!filtered.length){const empty=document.createElement('div');empty.className='empty';const title=document.createElement('strong');title.textContent='Chưa có ảnh hoặc video';const text=document.createElement('span');text.textContent='Âm thanh được lưu riêng trong nút Nhạc.';empty.append(title,text);gallery.appendChild(empty);return}filtered.forEach((item,index)=>{const card=document.createElement('article');card.className='media-card';card.tabIndex=0;card.setAttribute('aria-label',`Mở ${item.name||'tệp'}`);const preview=document.createElement('div');preview.className='preview';const kind=typeOf(item);if(kind==='image'){const image=document.createElement('img');image.src=item.url;image.alt=item.name||'Hình ảnh';image.loading='lazy';image.decoding='async';preview.appendChild(image)}else{const video=document.createElement('video');video.src=item.url;video.preload='metadata';video.muted=true;video.setAttribute('aria-label',item.name||'Video');preview.appendChild(video)}const info=document.createElement('div');info.className='media-info';const name=document.createElement('p');name.className='media-name';name.title=item.name||'';name.textContent=item.name||'Tệp không tên';const meta=document.createElement('div');meta.className='media-meta';const left=document.createElement('span');left.textContent=kind==='image'?'Hình ảnh':'Video';const right=document.createElement('span');right.textContent=`${formatSize(item.size)} · ${formatDate(item.createdAt)}`;meta.append(left,right);info.append(name,meta);const remove=document.createElement('button');remove.className='card-delete';remove.type='button';remove.textContent='×';remove.title='Xóa tệp';remove.setAttribute('aria-label',`Xóa ${item.name||'tệp'}`);remove.onclick=e=>{e.stopPropagation();deleteItem(item)};card.append(preview,info,remove);const open=()=>openModal(index);card.onclick=open;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};gallery.appendChild(card)})}
  
  $("musicBtn").onclick=e=>{e.stopPropagation();$("musicPopover").classList.toggle('open');renderMusicList()};$("musicPopover").onclick=e=>e.stopPropagation();document.addEventListener('click',()=>$("musicPopover").classList.remove('open'));
  function renderMusicList(){const box=$("musicPopover");box.replaceChildren();const list=allMedia.filter(item=>typeOf(item)==='audio');if(!list.length){const empty=document.createElement('p');empty.style.cssText='padding:18px;text-align:center;color:var(--muted);font-size:13px';empty.textContent='Chưa có tệp âm thanh.';box.appendChild(empty);return}const title=document.createElement('h3');title.className='music-title';title.textContent='Danh sách Nhạc';box.appendChild(title);list.forEach(item=>{const row=document.createElement('div');row.className='music-row';const play=document.createElement('button');play.className='music-play';play.type='button';play.textContent=`▶ ${item.name||'Âm thanh'}`;play.onclick=()=>playMusic(item);const del=document.createElement('button');del.className='music-remove';del.type='button';del.textContent='Xóa';del.onclick=()=>deleteItem(item);row.append(play,del);box.appendChild(row)})}
  function playMusic(item){if(currentAudio.src===item.url&&!currentAudio.paused)currentAudio.pause();else{currentAudio.src=item.url;currentAudio.play().catch(()=>setStatus('Hãy chạm vào nút Nhạc để phát âm thanh.',true))}renderMusicList();currentAudio.onended=renderMusicList}
  async function deleteItem(item){if(!confirm(`Bạn có chắc muốn xóa “${item.name||'tệp này'}” không?`))return;try{await db.ref(`media/${currentUser.uid}/${item.id}`).remove();if(currentAudio.src===item.url){currentAudio.pause();currentAudio.removeAttribute('src')}}catch(error){setStatus(`Không thể xóa tệp: ${error.message||'lỗi không xác định'}`,true)}}
  
  function openModal(index){if(!filtered.length)return;currentIndex=index;scale=1;translateX=0;translateY=0;const item=filtered[index],main=$("viewerMain");main.replaceChildren();$("modalTitle").textContent=item.name||'Tệp';$("counter").textContent=`${index+1}/${filtered.length}`;const element=document.createElement(typeOf(item)==='image'?'img':'video');element.id='viewerElement';element.src=item.url;if(typeOf(item)==='image'){element.alt=item.name||'Hình ảnh';element.draggable=false;initTouchZoom()}else{element.controls=true;element.autoplay=true;element.playsInline=true}main.appendChild(element);$("mediaModal").classList.add('open');updateTransform();$("downloadBtn").onclick=()=>downloadItem(item)}
  function closeModal(){const video=$("viewerMain").querySelector('video');if(video){video.pause();video.removeAttribute('src');video.load()}$("mediaModal").classList.remove('open');$("viewerMain").replaceChildren();gesturePointers.clear();isDragging=false}
  function navigate(direction){if(!filtered.length)return;openModal((currentIndex+direction+filtered.length)%filtered.length)}
  $("closeModal").onclick=closeModal;$("prevBtn").onclick=()=>navigate(-1);$("nextBtn").onclick=()=>navigate(1);$("mediaModal").onclick=e=>{if(e.target===$("mediaModal"))closeModal()};
  function updateTransform(){const el=$("viewerElement");if(!el)return;el.style.transform=`translate(${translateX}px,${translateY}px) scale(${scale})`;$("zoomValue").textContent=`${Math.round(scale*100)}%`}
  $("zoomIn").onclick=()=>{scale=Math.min(5,scale+.25);updateTransform()};$("zoomOut").onclick=()=>{scale=Math.max(.5,scale-.25);updateTransform()};$("zoomReset").onclick=()=>{scale=1;translateX=0;translateY=0;updateTransform()};
  function initTouchZoom(){const viewer=$("viewer");viewer.onpointerdown=e=>{gesturePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});viewer.setPointerCapture(e.pointerId);gestureMoved=false;if(gesturePointers.size===1){const now=Date.now();if(now-gestureLastTap<300){scale=scale>1?1:2.5;translateX=0;translateY=0;updateTransform()}gestureLastTap=now;gestureStartX=e.clientX;gestureStartY=e.clientY;gestureStartDistance=0;gestureStartScale=scale}else if(gesturePointers.size===2){const points=[...gesturePointers.values()];gestureStartDistance=Math.hypot(points[0].x-points[1].x,points[0].y-points[1].y);gestureStartScale=scale}};viewer.onpointermove=e=>{if(!gesturePointers.has(e.pointerId))return;gesturePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(gesturePointers.size===2){const points=[...gesturePointers.values()];const distance=Math.hypot(points[0].x-points[1].x,points[0].y-points[1].y);if(gestureStartDistance>0){scale=Math.max(.5,Math.min(5,gestureStartScale*distance/gestureStartDistance));updateTransform()}gestureMoved=true}else if(gesturePointers.size===1){const dx=e.clientX-gestureStartX,dy=e.clientY-gestureStartY;if(Math.abs(dx)>5||Math.abs(dy)>5)gestureMoved=true;if(scale>1){translateX=dx;translateY=dy;updateTransform()}}};viewer.onpointerup=e=>{const start=gesturePointers.get(e.pointerId);const dx=start?e.clientX-start.x:0,dy=start?e.clientY-start.y:0;gesturePointers.delete(e.pointerId);if(gesturePointers.size===0){if(scale<=1&&!gestureMoved&&Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.4)navigate(dx<0?1:-1);isDragging=false}};viewer.onpointercancel=()=>{gesturePointers.clear();isDragging=false};viewer.onwheel=e=>{e.preventDefault();scale=Math.max(.5,Math.min(5,scale-e.deltaY*.001));updateTransform()}}
  function downloadItem(item){const link=document.createElement('a');link.href=item.url;link.download=item.name||'mediavault-file';link.target='_blank';document.body.appendChild(link);link.click();link.remove()}
  document.onkeydown=e=>{if(!$('mediaModal').classList.contains('open'))return;if(e.key==='Escape')closeModal();if(e.key==='ArrowLeft')navigate(-1);if(e.key==='ArrowRight')navigate(1)};
  window.addEventListener('beforeunload',()=>{if(uploadReader)uploadReader.abort();currentAudio.pause()});
})();
</script>
</body>
